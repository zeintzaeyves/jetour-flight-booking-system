name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          # Unreachable on purpose: the build must never touch a real database.
          # The homepage falls back gracefully when the database can't be reached.
          MONGODB_URI: mongodb://127.0.0.1:1/ci
          ADMIN_PASSWORD: ci-only-password
          ADMIN_SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789
